{% load i18n %}
<div class="row row-cols-2 row-cols-md-3 row-cols-lg-4 g-3">
  {% for img in images %}
  <div class="col">
    <figure class="card h-100 shadow-sm mb-0 photo-card">
      <a href="{{ img.url }}" data-lightbox data-download="{% url 'photo_download' img.id %}" data-caption="{% if img.participant %}{{ img.participant.display_name }} · {% endif %}{% if img.contestant %}{{ img.contestant.full_name }} · {% endif %}{% trans 'Марафон' %} {{ img.marathon.name }}">
        <img src="{% url 'photo_thumb' img.id %}" class="card-img-top" loading="lazy" alt="{% if img.contestant %}{{ img.contestant.full_name }}{% else %}Lithops{% endif %}">
      </a>
      {% if img.is_winner %}<span class="badge text-bg-warning position-absolute top-0 end-0 m-2"><i class="bi bi-trophy-fill"></i></span>{% endif %}
      <figcaption class="card-body p-2 small">
        {% if img.participant and not hide_participant %}
          <a href="{{ img.participant.get_absolute_url }}" class="fw-semibold text-decoration-none">{{ img.participant.display_name }}</a><br>
        {% endif %}
        {% if img.contestant %}<span class="text-secondary">{{ img.contestant.full_botanic_name }}</span><br>{% endif %}
        {% if img.nomination %}<span class="text-secondary"><i class="bi bi-award"></i> {{ img.nomination.title }}</span><br>{% endif %}
        {% if img.marathon %}<a href="{% url 'marathon' img.marathon.name %}" class="badge text-bg-light text-decoration-none">{% trans 'Марафон' %} {{ img.marathon.name }}</a>{% endif %}
      </figcaption>
    </figure>
  </div>
  {% endfor %}
</div>

<div class="modal fade" id="lightbox" tabindex="-1" aria-hidden="true">
  <div class="modal-dialog modal-dialog-centered modal-xl">
    <div class="modal-content bg-dark text-light">
      <div class="modal-header border-0 py-2">
        <small class="modal-title" id="lightbox-caption"></small>
        <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal" aria-label="Close"></button>
      </div>
      <div class="modal-body p-0 text-center position-relative">
        <img id="lightbox-img" src="" class="img-fluid" style="max-height:80vh" alt="">
        <button type="button" class="lightbox-nav start-0" id="lightbox-prev" aria-label="Previous"><i class="bi bi-chevron-left"></i></button>
        <button type="button" class="lightbox-nav end-0" id="lightbox-next" aria-label="Next"><i class="bi bi-chevron-right"></i></button>
      </div>
      <div class="modal-footer border-0 py-2 justify-content-between">
        <small class="text-secondary" id="lightbox-counter"></small>
        <a id="lightbox-download" href="" class="btn btn-sm btn-light"><i class="bi bi-download"></i> {% trans 'Скачать' %}</a>
      </div>
    </div>
  </div>
</div>

<style>
  .lightbox-nav {
    position: absolute; top: 0; bottom: 0; width: 15%; min-width: 48px;
    border: 0; background: transparent; color: #fff; font-size: 2.5rem;
    opacity: .6; text-shadow: 0 0 8px rgba(0,0,0,.8);
  }
  .lightbox-nav:hover, .lightbox-nav:focus-visible { opacity: 1; }
</style>

<script>
  (function () {
    const modalEl = document.getElementById('lightbox');
    const img = document.getElementById('lightbox-img');
    let links = [], index = 0;

    function show(i) {
      index = (i + links.length) % links.length;
      const link = links[index];
      img.src = link.href;
      document.getElementById('lightbox-download').href = link.dataset.download;
      document.getElementById('lightbox-caption').textContent = link.dataset.caption;
      document.getElementById('lightbox-counter').textContent = (index + 1) + ' / ' + links.length;
      const single = links.length < 2;
      document.getElementById('lightbox-prev').hidden = single;
      document.getElementById('lightbox-next').hidden = single;
      // подгружаем соседей, чтобы листалось без задержки
      [index - 1, index + 1].forEach(function (j) {
        if (links.length > 1) new Image().src = links[(j + links.length) % links.length].href;
      });
    }

    document.addEventListener('click', function (e) {
      const link = e.target.closest('[data-lightbox]');
      if (!link) return;
      e.preventDefault();
      links = Array.from(document.querySelectorAll('[data-lightbox]'));
      show(links.indexOf(link));
      bootstrap.Modal.getOrCreateInstance(modalEl).show();
    });
    document.getElementById('lightbox-prev').addEventListener('click', function () { show(index - 1); });
    document.getElementById('lightbox-next').addEventListener('click', function () { show(index + 1); });

    document.addEventListener('keydown', function (e) {
      if (!modalEl.classList.contains('show')) return;
      if (e.key === 'ArrowLeft') show(index - 1);
      if (e.key === 'ArrowRight') show(index + 1);
    });

    let touchX = null;
    img.addEventListener('touchstart', function (e) { touchX = e.touches[0].clientX; }, { passive: true });
    img.addEventListener('touchend', function (e) {
      if (touchX === null) return;
      const dx = e.changedTouches[0].clientX - touchX;
      if (Math.abs(dx) > 40) show(index + (dx < 0 ? 1 : -1));
      touchX = null;
    });
  })();
</script>
