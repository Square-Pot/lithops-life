{% load i18n %}
<div class="row row-cols-2 row-cols-md-3 row-cols-lg-4 g-3">
  {% for img in images %}
  <div class="col">
    <figure class="card h-100 shadow-sm mb-0 photo-card">
      <a href="{{ img.url }}" data-lightbox data-download="{% url 'photo_download' img.id %}" data-caption="{% if img.participant %}{{ img.participant.display_name }} · {% endif %}{% if img.contestant %}{{ img.contestant.full_name }} · {% endif %}{% trans 'Марафон' %} {{ img.marathon.name }}">
        <img src="{% url 'photo_thumb' img.id %}" class="card-img-top" loading="lazy" alt="{% if img.contestant %}{{ img.contestant.full_name }}{% else %}Lithops{% endif %}">
      </a>
      {% if img.is_winner %}<span class="badge text-bg-warning position-absolute top-0 end-0 m-2"><i class="bi bi-trophy-fill"></i></span>{% endif %}
      <figcaption class="card-body p-2 small">
        {% if img.participant and not hide_participant %}
          <a href="{{ img.participant.get_absolute_url }}" class="fw-semibold text-decoration-none">{{ img.participant.display_name }}</a><br>
        {% endif %}
        {# название номинации обычно уже содержит вид — показываем что-то одно #}
        {% if img.nomination %}<span class="text-secondary"><i class="bi bi-award"></i> {{ img.nomination.title }}</span><br>
        {% elif img.contestant %}<span class="text-secondary">{{ img.contestant.full_botanic_name }}</span><br>{% endif %}
        {% if img.marathon %}<a href="{% url 'marathon' img.marathon.name %}" class="badge text-bg-light text-decoration-none">{% trans 'Марафон' %} {{ img.marathon.name }}</a>{% endif %}
      </figcaption>
    </figure>
  </div>
  {% endfor %}
</div>

{% include 'marathon/_lightbox.html' %}
