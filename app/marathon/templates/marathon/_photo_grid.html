{% load i18n %}
<div class="row row-cols-2 row-cols-md-3 row-cols-lg-4 g-3">
  {% for img in images %}
  <div class="col">
    <figure class="card h-100 shadow-sm mb-0 photo-card">
      <a href="{{ img.url }}" data-lightbox data-caption="{% if img.participant %}{{ img.participant.display_name }} · {% endif %}{% if img.contestant %}{{ img.contestant.full_name }} · {% endif %}{% trans 'Марафон' %} {{ img.marathon.name }}">
        <img src="{{ img.url }}" class="card-img-top" loading="lazy" alt="{% if img.contestant %}{{ img.contestant.full_name }}{% else %}Lithops{% endif %}">
      </a>
      {% if img.is_winner %}<span class="badge text-bg-warning position-absolute top-0 end-0 m-2"><i class="bi bi-trophy-fill"></i></span>{% endif %}
      <figcaption class="card-body p-2 small">
        {% if img.participant and not hide_participant %}
          <a href="{{ img.participant.get_absolute_url }}" class="fw-semibold text-decoration-none">{{ img.participant.display_name }}</a><br>
        {% endif %}
        {% if img.contestant %}<span class="text-secondary">{{ img.contestant.full_botanic_name }}</span><br>{% endif %}
        {% if img.nomination %}<span class="text-secondary"><i class="bi bi-award"></i> {{ img.nomination.title }}</span><br>{% endif %}
        {% if img.marathon %}<a href="{% url 'marathon' img.marathon.name %}" class="badge text-bg-light text-decoration-none">{% trans 'Марафон' %} {{ img.marathon.name }}</a>{% endif %}
      </figcaption>
    </figure>
  </div>
  {% endfor %}
</div>

<div class="modal fade" id="lightbox" tabindex="-1" aria-hidden="true">
  <div class="modal-dialog modal-dialog-centered modal-xl">
    <div class="modal-content bg-dark text-light">
      <div class="modal-header border-0 py-2">
        <small class="modal-title" id="lightbox-caption"></small>
        <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal" aria-label="Close"></button>
      </div>
      <div class="modal-body p-0 text-center">
        <img id="lightbox-img" src="" class="img-fluid" style="max-height:85vh" alt="">
      </div>
      <div class="modal-footer border-0 py-2">
        <a id="lightbox-open" href="" target="_blank" class="btn btn-sm btn-outline-light"><i class="bi bi-box-arrow-up-right"></i> {% trans 'Оригинал' %}</a>
      </div>
    </div>
  </div>
</div>

<script>
  document.addEventListener('click', function (e) {
    const link = e.target.closest('[data-lightbox]');
    if (!link) return;
    e.preventDefault();
    document.getElementById('lightbox-img').src = link.href;
    document.getElementById('lightbox-open').href = link.href;
    document.getElementById('lightbox-caption').textContent = link.dataset.caption;
    bootstrap.Modal.getOrCreateInstance(document.getElementById('lightbox')).show();
  });
</script>
