version: "3.9"

services:
  app:
    build:
      context: .
      args:
        - APP_UID=${APP_UID:-1000}
    restart: always
    # публичные DNS вместо DNS хостинга: один из них не отвечает, и загрузка фото в Object Storage
    # падала с «Could not connect to the endpoint URL». Имена сервисов (app, proxy) по-прежнему резолвит Docker.
    dns:
      - 77.88.8.8
      - 8.8.8.8
    volumes:
      - /static/lithops-life:/vol/static
      - ./app/db.sqlite3:/app/db.sqlite3
    environment:
      - DJANGO_SECRET_KEY=${DJANGO_SECRET_KEY}
      - DJANGO_ALLOWED_HOSTS=${DOMAIN}
      - DJANGO_DEBUG=0
      - DOMAIN=${DOMAIN}
      - EMAIL_FROM_SITE=${EMAIL_FROM_SITE}
      - EMAIL_FROM_SITE_PASSWD=${EMAIL_FROM_SITE_PASSWD}
      - EMAIL_FROM_SITE_TO=${EMAIL_FROM_SITE_TO}
      - RECAPTCHA_SECRET_KEY=${RECAPTCHA_SECRET_KEY}
      # кабинет номинаций: загрузка фото в Object Storage (marathon/storage.py)
      - AWS_ACCESS_KEY_ID=${AWS_ACCESS_KEY_ID}
      - AWS_SECRET_ACCESS_KEY=${AWS_SECRET_ACCESS_KEY}

  proxy:
    build:
      context: ./docker/proxy
    restart: always
    depends_on:
      - app
    ports:
      - 80:80
      - 443:443
    volumes:
      - certbot-web:/vol/www
      - proxy-dhparams:/vol/proxy
      - certbot-certs:/etc/letsencrypt
      - /static/lithops-life:/vol/static
    environment:
      - DOMAIN=${DOMAIN}

  certbot:
    build:
      context: ./docker/certbot
    command: echo "Skipping..."
    # продление сертификата ходит к Let's Encrypt — та же причина, что у app
    dns:
      - 77.88.8.8
      - 8.8.8.8
    environment:
      - EMAIL=${ACME_DEFAULT_EMAIL}
      - DOMAIN=${DOMAIN}
    volumes:
      - certbot-web:/vol/www
      - certbot-certs:/etc/letsencrypt/
    depends_on:
      - proxy

volumes:
  certbot-web:
  proxy-dhparams:
  certbot-certs: